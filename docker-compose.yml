services:
  ai-image-detector:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-image-detector:offline
    ports:
      - "${AIDETECTOR_PORT:-8000}:8000"
    environment:
      AIDETECTOR_BACKEND: ${AIDETECTOR_BACKEND:-univfd}
      AIDETECTOR_DEVICE: ${AIDETECTOR_DEVICE:-cpu}
      AIDETECTOR_THRESHOLD: ${AIDETECTOR_THRESHOLD:-0.5}
      HOME: /opt/aidetect
      XDG_CACHE_HOME: /opt/aidetect/.cache
      HF_HOME: /opt/aidetect/.cache/huggingface
      HF_HUB_CACHE: /opt/aidetect/.cache/huggingface/hub
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    command:
      - aidetect
      - api
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --backend
      - "${AIDETECTOR_BACKEND:-univfd}"
      - --device
      - "${AIDETECTOR_DEVICE:-cpu}"
      - --threshold
      - "${AIDETECTOR_THRESHOLD:-0.5}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
